<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookLeaf Publishing — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF7F2;--brown:#2C1810;--gold:#C9A84C;--gold-light:#E8C97A;--rust:#8B3A2A;--text:#1A1208;--muted:#7A6A5A}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--cream);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(ellipse at 20% 50%,rgba(201,168,76,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(139,58,42,.06) 0%,transparent 50%)}
.login-wrap{width:420px;background:#fff;border-radius:2px;box-shadow:0 2px 40px rgba(44,24,16,.12),0 0 0 1px rgba(201,168,76,.15);overflow:hidden}
.login-header{background:var(--brown);padding:36px 40px 28px;text-align:center}
.logo-mark{width:48px;height:48px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px}
.login-header h1{font-family:'Playfair Display',serif;color:var(--cream);font-size:26px;font-weight:600}
.login-header p{color:rgba(250,247,242,.5);font-size:12px;margin-top:5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:300}
.login-body{padding:32px 40px 36px}
.form-group{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:7px}
input{width:100%;padding:11px 14px;border:1px solid rgba(44,24,16,.15);border-radius:2px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--cream);transition:border-color .2s,box-shadow .2s;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.btn{width:100%;padding:13px;background:var(--brown);color:var(--gold-light);border:none;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background .2s;margin-top:6px}
.btn:hover{background:#3d2015}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error-msg{background:rgba(139,58,42,.08);border:1px solid rgba(139,58,42,.2);color:var(--rust);padding:10px 14px;border-radius:2px;font-size:13px;margin-top:12px;display:none}
.demo-creds{margin-top:22px;padding-top:18px;border-top:1px solid rgba(44,24,16,.08)}
.demo-creds p{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;font-weight:500}
.cred-row{display:flex;justify-content:space-between;align-items:center;background:var(--cream);padding:8px 12px;border-radius:2px;margin-bottom:5px;cursor:pointer;transition:background .15s;border:1px solid transparent}
.cred-row:hover{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3)}
.cred-role{font-size:10px;font-weight:500;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.cred-info{font-size:12px;color:var(--muted)}
.cred-hint{font-size:10px;color:var(--muted);opacity:.5}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <div class="logo-mark">📚</div>
    <h1>BookLeaf</h1>
    <p>Publishing Platform</p>
  </div>
  <div class="login-body">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="demo-creds">
      <p>Quick Login (click to fill)</p>
      <div class="cred-row" onclick="fillCreds('arjun@example.com','author123')">
        <div><div class="cred-role">Author</div><div class="cred-info">arjun@example.com / author123</div></div>
        <div class="cred-hint">→</div>
      </div>
      <div class="cred-row" onclick="fillCreds('admin@bookleaf.com','admin123')">
        <div><div class="cred-role">Admin</div><div class="cred-info">admin@bookleaf.com / admin123</div></div>
        <div class="cred-hint">→</div>
      </div>
    </div>
  </div>
</div>
<script>
function fillCreds(e,p){document.getElementById('email').value=e;document.getElementById('password').value=p}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin()});
async function handleLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('errorMsg');
  err.style.display='none';
  if(!email||!password){showError('Please enter email and password.');return}
  btn.textContent='Signing In...';btn.disabled=true;
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok){showError(data.error||'Login failed');return}
    localStorage.setItem('bl_token',data.token);
    localStorage.setItem('bl_role',data.role);
    localStorage.setItem('bl_name',data.name);
    if(data.authorId)localStorage.setItem('bl_author_id',data.authorId);
    window.location.href=data.role==='admin'?'/admin/dashboard.html':'/author/dashboard.html';
  }catch(e){showError('Server error. Is the backend running?')}
  finally{btn.textContent='Sign In';btn.disabled=false}
}
function showError(msg){const e=document.getElementById('errorMsg');e.textContent=msg;e.style.display='block'}
const token=localStorage.getItem('bl_token'),role=localStorage.getItem('bl_role');
if(token&&role)window.location.href=role==='admin'?'/admin/dashboard.html':'/author/dashboard.html';
</script>
</body>
</html>
