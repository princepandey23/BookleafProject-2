<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookLeaf — Author Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF7F2;--brown:#2C1810;--gold:#C9A84C;--gold-light:#E8C97A;--rust:#8B3A2A;--sage:#5A7A5F;--text:#1A1208;--muted:#7A6A5A;--border:rgba(44,24,16,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh}
.topbar{background:var(--brown);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100}
.topbar-brand{font-family:'Playfair Display',serif;color:var(--gold-light);font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-name{color:rgba(250,247,242,.7);font-size:13px}
.btn-logout{background:transparent;border:1px solid rgba(201,168,76,.3);color:var(--gold-light);padding:6px 14px;border-radius:2px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.5px;transition:all .2s}
.btn-logout:hover{background:rgba(201,168,76,.1)}
.main{max-width:1100px;margin:0 auto;padding:32px 24px}
.page-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--brown);margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:#fff;border-radius:2px;padding:22px 24px;box-shadow:0 1px 8px rgba(44,24,16,.06);border:1px solid var(--border)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:300;color:var(--brown);font-family:'Playfair Display',serif}
.stat-value.earned{color:var(--sage)}
.stat-value.pending{color:var(--rust)}
.stat-value.paid{color:var(--gold)}
.section-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--brown);margin-bottom:16px;font-weight:600}
.book-card{background:#fff;border-radius:2px;margin-bottom:14px;box-shadow:0 1px 8px rgba(44,24,16,.06);border:1px solid var(--border);overflow:hidden}
.book-header{padding:18px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border)}
.book-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--brown);margin-bottom:4px}
.book-meta{display:flex;gap:12px;flex-wrap:wrap}
.book-meta span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.5px}
.badge-published{background:rgba(90,122,95,.12);color:var(--sage)}
.badge-production{background:rgba(201,168,76,.12);color:#A07A20}
.royalty-status{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:12px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-green{background:#4CAF50}
.dot-yellow{background:#FF9800}
.dot-red{background:#f44336}
.dot-none{background:#ccc}
.status-label{font-size:12px;font-weight:500}
.status-green{color:#388E3C}
.status-yellow{color:#F57C00}
.status-red{color:#D32F2F}
.book-royalty{padding:16px 22px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.royalty-item .ri-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:5px;font-weight:500}
.royalty-item .ri-value{font-size:16px;font-weight:400;color:var(--text)}
.royalty-item .ri-value.earned{color:var(--sage)}
.royalty-item .ri-value.pending{color:var(--rust)}
.royalty-item .ri-value.paid{color:var(--gold)}
.platforms{padding:10px 22px 14px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid rgba(44,24,16,.05)}
.platform-tag{background:var(--cream);border:1px solid var(--border);padding:3px 10px;border-radius:20px;font-size:11px;color:var(--muted)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.inprod-notice{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);padding:12px 16px;border-radius:2px;font-size:13px;color:#7A5A10;margin-top:10px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand">📚 BookLeaf</div>
  <div class="topbar-right">
    <span class="topbar-name" id="authorName">Loading...</span>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</div>
<div class="main">
  <div class="page-title" id="welcomeTitle">My Dashboard</div>
  <div class="page-sub">Your royalty overview and book portfolio</div>

  <div class="summary-grid">
    <div class="stat-card">
      <div class="stat-label">Total Royalty Earned</div>
      <div class="stat-value earned" id="sumEarned">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Royalty Paid</div>
      <div class="stat-value paid" id="sumPaid">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Pending</div>
      <div class="stat-value pending" id="sumPending">—</div>
    </div>
  </div>

  <div class="section-title">My Books</div>
  <div id="booksContainer"><div class="loading">Loading your books...</div></div>
</div>

<script>
const token = localStorage.getItem('bl_token');
const role = localStorage.getItem('bl_role');
if (!token || role !== 'author') { window.location.href = '/'; }

function logout() { localStorage.clear(); window.location.href = '/'; }

function fmt(n) { return '₹' + Number(n||0).toLocaleString('en-IN'); }
function fmtDate(d) { if (!d) return 'Never'; return new Date(d).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'}); }

const statusInfo = {
  green: { label: 'Fully Paid', cls: 'status-green', dot: 'dot-green' },
  yellow: { label: 'Pending', cls: 'status-yellow', dot: 'dot-yellow' },
  red: { label: 'Overdue', cls: 'status-red', dot: 'dot-red' },
  none: { label: 'No Data', cls: '', dot: 'dot-none' }
};

async function loadDashboard() {
  try {
    const res = await fetch('/api/author/dashboard', { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();

    document.getElementById('authorName').textContent = data.author.name;
    document.getElementById('welcomeTitle').textContent = 'Welcome back, ' + data.author.name.split(' ')[0];
    document.getElementById('sumEarned').textContent = fmt(data.summary.total_earned);
    document.getElementById('sumPaid').textContent = fmt(data.summary.total_paid);
    document.getElementById('sumPending').textContent = fmt(data.summary.total_pending);

    const container = document.getElementById('booksContainer');
    if (!data.books.length) { container.innerHTML = '<div class="no-data">No books found.</div>'; return; }

    container.innerHTML = data.books.map(book => {
      const si = statusInfo[book.royalty_status] || statusInfo.none;
      const r = book.royalty;
      const isProduction = book.status === 'In Production';
      return `
        <div class="book-card">
          <div class="book-header">
            <div>
              <div class="book-title">${book.title}</div>
              <div class="book-meta">
                <span>${book.genre}</span>
                <span>ISBN: ${book.isbn}</span>
                <span>MRP: ₹${book.mrp}</span>
                ${book.publication_date ? `<span>Published: ${fmtDate(book.publication_date)}</span>` : ''}
                <span class="badge ${isProduction?'badge-production':'badge-published'}">${book.status}</span>
              </div>
            </div>
            <div class="royalty-status">
              <div class="dot ${si.dot}"></div>
              <span class="status-label ${si.cls}">${si.label}</span>
            </div>
          </div>
          ${isProduction ? `<div class="inprod-notice">📖 This book is currently in production. Royalty data will appear once it is published.</div>` :
          r ? `<div class="book-royalty">
            <div class="royalty-item"><div class="ri-label">Copies Sold</div><div class="ri-value">${r.total_copies_sold.toLocaleString()}</div></div>
            <div class="royalty-item"><div class="ri-label">Total Earned</div><div class="ri-value earned">${fmt(r.total_royalty_earned)}</div></div>
            <div class="royalty-item"><div class="ri-label">Paid</div><div class="ri-value paid">${fmt(r.royalty_paid)}</div></div>
            <div class="royalty-item"><div class="ri-label">Pending</div><div class="ri-value pending">${fmt(r.royalty_pending)}</div></div>
            <div class="royalty-item"><div class="ri-label">Last Payout</div><div class="ri-value">${fmtDate(r.last_payout_date)}</div></div>
          </div>` : '<div style="padding:14px 22px;font-size:13px;color:var(--muted)">No royalty data available yet.</div>'}
          <div class="platforms">
            ${book.platforms.map(p=>`<span class="platform-tag">${p}</span>`).join('')}
            ${book.platforms.length===0?'<span style="font-size:12px;color:var(--muted)">No platforms listed</span>':''}
            <span class="platform-tag" style="background:rgba(44,24,16,.05)">📦 ${book.print_partner}</span>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('booksContainer').innerHTML = '<div class="no-data">Error loading data. Please refresh.</div>';
  }
}

loadDashboard();
</script>
</body>
</html>
